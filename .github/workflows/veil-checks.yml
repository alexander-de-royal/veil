# Every push and pull request: Veil's fast checks (veil/ci/checks.sh), ~10 min.
# No compiling: it proves the patch set still applies to its Firefox and that
# every pref, policy and updater setting Veil relies on still exists.
name: Veil checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q patch xz-utils gnupg
      - run: veil/ci/checks.sh
