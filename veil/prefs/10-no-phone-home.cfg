/** VEIL - PHASE 2: what LibreWolf still sends home
 *
 * Every entry below was SEEN in a capture of a fresh LibreWolf 157 profile
 * (veil/tools/audit.sh; results in veil/captures/baseline-*). Nothing is here
 * on speculation. defaultPref, not lockPref, so a user can still turn a
 * feature back on in about:config.
 */

// aus5.mozilla.org/update/3/SystemAddons/<version>/<build id>/<os version>/...
// Checks for out-of-band updates to the built-in system add-ons, and the URL
// itself reports the exact build and OS version. Veil ships those add-ons
// with each release instead.
// Trade-off: a Mozilla hotfix to a system add-on waits for the next Veil
// build. No effect on websites.
defaultPref("extensions.systemAddon.update.enabled", false);
defaultPref("extensions.systemAddon.update.url", "");

// wss://push.services.mozilla.com - the Web Push connection. It is opened at
// startup whether or not any site uses push, and it registers a persistent
// per-install ID with Mozilla.
// Trade-off (BREAKS A FEATURE): sites can no longer send notifications while
// their tab is closed - Gmail, Slack, Discord, WhatsApp Web, calendar
// reminders. With the tab open they still work. Sites feature-detect push, so
// nothing errors; they just stay quiet. Remote Settings also loses its
// instant-update channel and falls back to polling (daily).
defaultPref("dom.push.enabled", false);
defaultPref("dom.push.connection.enabled", false);

// services.addons.mozilla.org/api/v4/addons/search/?guid=... - refreshes
// descriptions, ratings and screenshots for installed add-ons.
// Trade-off: about:addons shows less detail. Add-on UPDATES are unaffected
// (that is extensions.update.enabled, deliberately left on).
defaultPref("extensions.getAddons.cache.enabled", false);
