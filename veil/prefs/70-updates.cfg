/** Phase 7: signed auto-updates (Firefox's updater; apply.py turns it on).
 *
 * LibreWolf's updater prefs stay: check every 4 hours, no prompt, install on
 * restart. What changes is where to, and who is trusted: apply.py sets the
 * AppUpdateURL policy from veil/release.json and swaps in Veil's public keys,
 * so only a MAR signed with ~/.veil-signing applies.
 *
 * PRIVACY: this is a deliberate phone-home. Every 4 hours the browser asks
 * GitHub for update-<platform>.xml, so GitHub sees your IP address and that
 * you run Veil on that platform. Unlike Firefox's update URL, ours carries no
 * version, build, locale or OS details. To stop it entirely, set the
 * DisableAppUpdate policy (then update by hand).
 */

// Where "Download manually" and release-notes links go (were LibreWolf's).
defaultPref("app.update.url.manual", "https://github.com/alexander-de-royal/veil/releases/latest");
defaultPref("app.update.url.details", "https://github.com/alexander-de-royal/veil/releases");
defaultPref("app.releaseNotesURL", "https://github.com/alexander-de-royal/veil/releases");
defaultPref("app.releaseNotesURL.aboutDialog", "https://github.com/alexander-de-royal/veil/releases");
defaultPref("app.releaseNotesURL.prompt", "https://github.com/alexander-de-royal/veil/releases");
