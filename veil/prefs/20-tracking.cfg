/** VEIL - PHASE 3: tracker blocking
 *
 * Most of phase 3 is already LibreWolf's (settings/librewolf.cfg):
 *   - ETP "strict": tracker lists, Total Cookie Protection, bounce-tracking
 *     protection, query stripping (browser.contentblocking.features.strict)
 *   - network.cookie.cookieBehavior.optInPartitioning: third-party cookies are
 *     BLOCKED, not just partitioned; only cookies that opt in to partitioning
 *     (CHIPS, the "Partitioned" attribute) are accepted in a third-party frame
 *   - privacy.query_stripping.strip_list: Brave's ~70 click-ID parameters
 *   - uBlock Origin with EasyList, EasyPrivacy, AdGuard URL Tracking
 *     Protection (strips utm_* and hundreds more), URLhaus, Peter Lowe's
 * Veil bundles uBlock Origin into the build (veil/extensions.json) so it is
 * active from the first page instead of after a download.
 * veil/tests/test_tracking.py checks that each of these is actually in effect.
 */

// "Copy Clean Link" in the link and address-bar menus, and stripping when a
// link is shared: removes tracking parameters from what you copy, so they
// don't follow the link to whoever you send it to.
// Trade-off: none for browsing; it only changes copied text.
defaultPref("privacy.query_stripping.strip_on_share.enabled", true);
