/** VEIL - PHASE 5: uniformity, on top of LibreWolf's resistFingerprinting
 *
 * resistFingerprinting (RFP, from LibreWolf) makes most of the fingerprint
 * the same for every user: UTC timezone, 16.7 ms timers, one user agent per
 * OS, spoofed hardware, light mode, only the OS's bundled fonts. Measured with
 * veil/tests/fp_collect.py, two things still varied from machine to machine.
 * The two prefs below close them. veil/tests/test_fingerprint.py checks it.
 */

// Languages: navigator.languages, Accept-Language and the Intl locale all
// followed the user's settings (a Japanese-preferring user sent "ja"; this
// Mac's region showed up as Intl locale en-GB). 2 = always present en-US.
// Trade-off (CHANGES SITES): sites that pick a language from the browser
// show English; web apps that format dates and numbers with the browser
// locale use US style (MM/DD/YYYY, 12-hour clock). Picking a language on the
// site itself still works. For a non-English speaker this is a real cost.
defaultPref("privacy.spoof_english", 2);
// spoof_english=2 only rewrites intl.accept_languages at the moment the pref
// CHANGES (RFPHelper.sys.mjs), so on its own it does nothing for a new
// profile. The default list otherwise comes from the browser's UI language,
// which in a multi-locale build follows the OS (a Japanese Mac would send
// "ja"). Make the default English too. A language the user picks in Settings
// still wins: that is their explicit choice, not a trait of their machine.
defaultPref("intl.accept_languages", "en-US, en");

// Letterboxing: without it the page saw the exact window size (and RFP
// reports the window as the screen size). With it the page area is rounded
// down to a common size and the leftover shows as an empty margin.
// Trade-off: a margin of up to ~100 px around pages when the window is not
// a common size. Breaks nothing.
defaultPref("privacy.resistFingerprinting.letterboxing", true);
