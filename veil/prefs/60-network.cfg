/** Phase 6: HTTPS-only, encrypted DNS, WebRTC.
 *
 * Already provided by LibreWolf and checked by veil/tests/test_network.py:
 *  - HTTPS-only mode (policy "HttpsOnlyMode": "enabled"): http:// is upgraded,
 *    a site without https gets a "Continue to HTTP site" page. Its background
 *    probe (one anonymous request to http://<host>/, no path, no cookies, only
 *    if https hasn't answered after 2.2 s) stays on: without it, http-only
 *    sites that ignore port 443 take up to 90 s to show that page.
 *  - Mixed content: images/media upgraded to https, scripts blocked (Firefox).
 *  - WebRTC hides local IPs behind random *.local names, and offers only the
 *    interface that routes to the site, unless the site has camera/mic access.
 *
 * Firefox 157 notes: network.trr.mode 3 still resolves the resolver's own
 * hostname (dns10.quad9.net) once with the system DNS, unless
 * network.trr.bootstrapAddr is set; we don't hard-code Quad9's IPs.
 * Encrypted Client Hello needs HTTPS records, which come from DoH here.
 */

// Encrypted DNS only, no silent fallback to the network's plaintext DNS
// (LibreWolf ships it off: mode 5). Resolver: LibreWolf's choice, Quad9
// (network.trr.uri). Hostnames listed in /etc/hosts and *.local still work.
// BREAKS: networks that block DNS-over-HTTPS (some offices, schools, hotel
// Wi-Fi before you log in) show "Secure DNS failed" on every site, and
// names only your company's DNS knows (intranet.corp) don't resolve.
// Fix per network: add domains to network.trr.excluded-domains, or set the
// mode to 2 (fallback allowed) in Settings > Privacy > DNS over HTTPS.
defaultPref("network.trr.mode", 3);

// During calls (camera/mic allowed) Firefox otherwise offers every network
// interface, e.g. your home LAN address next to the VPN one.
// Trade-off: a call between two devices on a secondary interface (a VM
// bridge, a second Wi-Fi) goes the long way round, via the main one.
defaultPref("media.peerconnection.ice.default_address_only", true);
